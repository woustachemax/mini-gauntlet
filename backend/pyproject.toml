[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "BLE", "TRY"]
# Long messages in ValueError are how checks explain a CANNOT_SCAN, so they are wanted.
ignore = ["TRY003"]

[tool.ruff.lint.per-file-ignores]
# The engine catches every exception on purpose: one bad record must never stop a scan.
"app/scanner/engine.py" = ["BLE001"]
# Checks raise ValueError for any field they can't evaluate, wrong type included,
# because callers catch ValueError to turn it into CANNOT_SCAN.
"app/scanner/checks/*.py" = ["TRY004"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
