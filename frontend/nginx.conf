server {
    listen 3000;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's DNS. Resolving "api" per request means a restarted api container is found again,
    # and a stopped one gives a 502, which the dashboard shows as "Can't reach the API".
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;

    location /api/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
